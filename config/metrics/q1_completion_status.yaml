name: q1_completion_status
title: "FY27Q1 — Completion Status"
description: "Emulation status breakdown for the current quarter."
filter: >
  project = SHLD
  AND (labels = ATDT_CVE OR labels = LightCycles)
  AND labels = {{current_quarter}}
  AND issuetype != Sub-task
measure:
  kind: count
group_by:
  - by_value:
      Done: "status = Done"
      Closed: "status = Closed"
      In Progress: "status NOT IN (Done, Closed)"
chart: bar
target: null
