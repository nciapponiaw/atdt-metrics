name: lc_created_vs_resolved
title: "Light Cycles - Created vs. Resolved"
description: "Red = new intake, Green = resolved. Gap shows backlog buildup."
filter: >
  project = "Threat Research and Development"
  AND labels = LightCycles
  AND issuetype = Story
measure:
  kind: created_vs_resolved
  weeks: 5
  resolved_filter: "status in (Done, Closed)"
  label_format: day_first
chart: dual_area
chart_kwargs:
  hide_title: true
  footer_created_resolved: true
  period_description: "last 30 days (grouped Weekly)"
target: null
